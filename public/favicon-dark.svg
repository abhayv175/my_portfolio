<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="bh-clip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
    <radialGradient id="bh-halo" cx="50%" cy="50%" r="50%">
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#e4e4e7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06060b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bh-disk-back" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#e4e4e7" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#d4d4d8" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="bh-disk-front" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0" />
      <stop offset="22%" stop-color="#f4f4f5" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="78%" stop-color="#e4e4e7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#06060b" />

  <g clip-path="url(#bh-clip)">
    <!-- Ambient halo & subtle distant stars -->
    <circle cx="32" cy="32" r="29" fill="url(#bh-halo)" />
    <circle cx="14" cy="15" r="0.62" fill="#ffffff" opacity="0.65" />
    <circle cx="51" cy="18" r="0.50" fill="#ffffff" opacity="0.5" />
    <circle cx="16" cy="49" r="0.52" fill="#ffffff" opacity="0.48" />
    <circle cx="49" cy="48" r="0.60" fill="#ffffff" opacity="0.6" />

    <!-- Tilted Black Hole accretion assembly (-20deg matching dark shader roll) -->
    <g transform="rotate(-20 32 32)">
      <!-- Lensed upper gravitational arch behind horizon -->
      <path
        d="M 15 32 A 17 17.5 0 0 1 49 32"
        fill="none"
        stroke="url(#bh-disk-back)"
        stroke-width="4.2"
        stroke-linecap="round"
      />
      <!-- Outer wide accretion disk sweep -->
      <ellipse
        cx="32"
        cy="32"
        rx="28"
        ry="6.8"
        fill="none"
        stroke="url(#bh-disk-back)"
        stroke-width="3.2"
        opacity="0.85"
      />
      <!-- Event horizon shadow core -->
      <circle cx="32" cy="32" r="12.5" fill="#000000" />
      <!-- Razor-sharp white photon ring -->
      <circle
        cx="32"
        cy="32"
        r="12.8"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.6"
        opacity="0.95"
      />
      <!-- Front accretion streak passing across lower equator -->
      <path
        d="M 4.5 32.5 Q 32 40.5 59.5 32.5"
        fill="none"
        stroke="url(#bh-disk-front)"
        stroke-width="3.8"
        stroke-linecap="round"
      />
      <path
        d="M 10 32.2 Q 32 38.2 54 32.2"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.95"
      />
    </g>
  </g>

  <circle cx="32" cy="32" r="29.25" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
</svg>
