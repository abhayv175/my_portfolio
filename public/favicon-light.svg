<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="wh-clip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
    <radialGradient id="wh-halo" cx="50%" cy="50%" r="50%">
      <stop offset="35%" stop-color="#09090b" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#52525b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wh-disk-back" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0.06" />
      <stop offset="30%" stop-color="#27272a" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#000000" stop-opacity="1" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="wh-disk-front" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#52525b" stop-opacity="0" />
      <stop offset="22%" stop-color="#18181b" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#000000" stop-opacity="1" />
      <stop offset="78%" stop-color="#27272a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#52525b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#ffffff" />

  <g clip-path="url(#wh-clip)">
    <!-- Subtle halo & inverted star specks -->
    <circle cx="32" cy="32" r="29" fill="url(#wh-halo)" />
    <circle cx="14" cy="18" r="0.62" fill="#09090b" opacity="0.52" />
    <circle cx="50" cy="15" r="0.52" fill="#09090b" opacity="0.6" />
    <circle cx="15" cy="48" r="0.52" fill="#09090b" opacity="0.5" />
    <circle cx="48" cy="49" r="0.60" fill="#09090b" opacity="0.55" />

    <!-- Mirrored tilted White Hole accretion assembly (+20deg matching light shader roll) -->
    <g transform="rotate(20 32 32)">
      <!-- Lensed upper gravitational ink arch -->
      <path
        d="M 15 32 A 17 17.5 0 0 1 49 32"
        fill="none"
        stroke="url(#wh-disk-back)"
        stroke-width="4.2"
        stroke-linecap="round"
      />
      <!-- Outer wide inverted accretion sweep -->
      <ellipse
        cx="32"
        cy="32"
        rx="28"
        ry="6.8"
        fill="none"
        stroke="url(#wh-disk-back)"
        stroke-width="3.2"
        opacity="0.88"
      />
      <!-- Pure white singularity core -->
      <circle cx="32" cy="32" r="12.5" fill="#ffffff" />
      <!-- Razor-sharp black photon ring -->
      <circle
        cx="32"
        cy="32"
        r="12.8"
        fill="none"
        stroke="#09090b"
        stroke-width="1.7"
        opacity="0.95"
      />
      <!-- Front dark ink streak passing across lower equator -->
      <path
        d="M 4.5 32.5 Q 32 40.5 59.5 32.5"
        fill="none"
        stroke="url(#wh-disk-front)"
        stroke-width="3.8"
        stroke-linecap="round"
      />
      <path
        d="M 10 32.2 Q 32 38.2 54 32.2"
        fill="none"
        stroke="#000000"
        stroke-width="1.4"
        stroke-linecap="round"
        opacity="0.95"
      />
    </g>
  </g>

  <circle cx="32" cy="32" r="29.25" fill="none" stroke="rgba(15,23,42,0.22)" stroke-width="1.5" />
</svg>
